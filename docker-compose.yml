services:
  model-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      TRAFFIC_MODEL_PATH: models/retrained_traffic_forecaster_20260903.pt
    volumes:
      - .:/app
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic_local_only
    ports:
      - "5432:5432"
    volumes:
      - traffic-db:/var/lib/postgresql/data

volumes:
  traffic-db: